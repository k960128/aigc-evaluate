server:
  port: 8800
  servlet:
    context-path: /api/aigc-eval
spring:
  application:
    name: aigc-eval
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: root
    password: G3a5tB7nD9f1
    url: jdbc:mysql://47.103.193.177:3305/data_free_eval_dev?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: LLMEvalHikariPool

# Elasticsearch 配置
  elasticsearch:
    uris: http://47.103.193.177:9200
    username: elastic
    password: G3a5tB7nD9f1

# Redis 配置
  data:
    redis:
      host: 47.103.193.177
      port: 6379
      password: Lxk960128.
      database: 4
  web:
    resources:
      add-mappings: false

# RAG 配置
rag:
  vector:
    type: pg # 预留，后续支持Milvus和pg
    pg:
      url: jdbc:postgresql://47.103.193.177:5432/aigc_eval
      username: postgres
      password: G3a5tB7nD9f1
      driver-class-name: org.postgresql.Driver
      initialize-schema: false
      schema-name: public
      table-name: t_knowledge_feature_vector
      dimensions: 1536
      max-document-batch-size: 10

# L2 配置
app:
  l2:
    # mysql-mock：使用 MySQL Mock 召回；real：使用 ES + PGVector；empty：空召回降级
    recall-mode: real
  l3:
    # real：调用 JudgeConfiguration 中的裁判大模型；default：不调用模型，直接降级人工核验
    judge-mode: real

# RocketMQ 配置
rocketmq:
  name-server: 47.103.193.177:9876
  producer:
    group: aigc-eval-producer-group

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true


# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always


eval:
  agent:
    sample-factory:
      worker-enabled: true
      generator:
        enabled: true
        base-url: http://localhost:11434
        model: qwen3.5:9b
        max-output-tokens: 1024
        temperature: 0.7
        request-timeout-seconds: 120
      # 样本质量评审角色（Critic），不是目标安全Judge。
      # 当前沿用生成角色的值；后续将任意字段改为独立值，即可只调整评审模型。
      critic:
        enabled: ${eval.agent.sample-factory.generator.enabled:false}
        base-url: ${eval.agent.sample-factory.generator.base-url:http://localhost:11434}
        model: ${eval.agent.sample-factory.generator.model:}
        max-output-tokens: ${eval.agent.sample-factory.generator.max-output-tokens:1024}
        temperature: ${eval.agent.sample-factory.generator.temperature:0.7}
        request-timeout-seconds: ${eval.agent.sample-factory.generator.request-timeout-seconds:120}
