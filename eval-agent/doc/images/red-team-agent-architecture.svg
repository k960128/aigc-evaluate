<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172b4d" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53657d"/></marker>
    <style>
      .title{font:700 28px 'Microsoft YaHei',Arial;fill:#152238}.sub{font:400 15px 'Microsoft YaHei',Arial;fill:#5d6b7e}
      .h{font:700 17px 'Microsoft YaHei',Arial;fill:#152238}.p{font:400 13px 'Microsoft YaHei',Arial;fill:#53657d}
      .line{stroke:#53657d;stroke-width:2;fill:none;marker-end:url(#arrow)}.soft{fill:#fff;stroke:#d7e0eb;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="54" y="58" class="title">红队自动化评测智能体总体架构</text>
  <text x="54" y="86" class="sub">Spring AI 业务实现：确定性编排器控制流程，多智能体完成专业决策，评测基础设施保存事实</text>

  <rect x="54" y="126" width="1172" height="92" rx="16" fill="#dcecff" stroke="#a8c9ed"/>
  <text x="86" y="164" class="h">前端评测工作台</text><text x="86" y="190" class="p">创建任务 · 配置风险范围 · 查看事件流 · 暂停恢复 · 结果复核</text>
  <rect x="864" y="147" width="310" height="50" rx="10" fill="#fff" stroke="#bcd5ef"/>
  <text x="1019" y="178" text-anchor="middle" class="p">HTTP API + SSE / WebSocket</text>

  <rect x="54" y="258" width="1172" height="132" rx="16" fill="#e9e4ff" stroke="#c8b9f4"/>
  <text x="86" y="294" class="h">RedTeamOrchestrator（普通 Java 业务代码）</text>
  <text x="86" y="322" class="p">状态机 · 预算 · 并发 · 重试 · 幂等 · 检查点 · 事件发布 · 人工复核</text>
  <rect x="854" y="282" width="322" height="76" rx="10" fill="#fff" stroke="#c8b9f4"/>
  <text x="1015" y="312" text-anchor="middle" class="p">SupervisorAgent</text>
  <text x="1015" y="336" text-anchor="middle" class="p">计划 / 下一步 / 停止建议</text>

  <rect x="54" y="430" width="1172" height="156" rx="16" fill="#fff6df" stroke="#efd18a"/>
  <text x="86" y="466" class="h">专业子智能体</text>
  <g filter="url(#shadow)">
    <rect x="86" y="486" width="206" height="72" rx="10" class="soft"/><text x="189" y="516" text-anchor="middle" class="h">策略智能体</text><text x="189" y="540" text-anchor="middle" class="p">风险覆盖 · 经验检索</text>
    <rect x="318" y="486" width="206" height="72" rx="10" class="soft"/><text x="421" y="516" text-anchor="middle" class="h">样本智能体</text><text x="421" y="540" text-anchor="middle" class="p">生成 · 变异 · 自检</text>
    <rect x="550" y="486" width="206" height="72" rx="10" class="soft"/><text x="653" y="516" text-anchor="middle" class="h">自适应攻击</text><text x="653" y="540" text-anchor="middle" class="p">有限多轮交互</text>
    <rect x="782" y="486" width="206" height="72" rx="10" class="soft"/><text x="885" y="516" text-anchor="middle" class="h">Judge / Verifier</text><text x="885" y="540" text-anchor="middle" class="p">判定 · 证据 · 复核</text>
  </g>

  <rect x="54" y="626" width="1172" height="84" rx="16" fill="#dcf5e8" stroke="#a4dbbf"/>
  <text x="86" y="662" class="h">评测基础设施与受控工具</text><text x="86" y="688" class="p">TargetModelGateway · MemoryService · ExperienceRetriever · MySQL · Redis · RocketMQ · Elasticsearch · PGVector</text>

  <path d="M640 218 L640 258" class="line"/><path d="M640 390 L640 430" class="line"/><path d="M640 586 L640 626" class="line"/>
  <path d="M854 320 L756 485" class="line"/><path d="M854 320 L988 485" class="line"/>
</svg>
