<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>观测 · 大模型安全评测工作台 v2</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #fff;
            --ink: #172239;
            --muted: #657189;
            --line: #e6eaf1;
            --primary: #355be8;
            --primary-soft: #edf1ff;
            --nav: #101a2e;
            --green: #128061;
            --green-soft: #eaf7f1;
            --amber: #a5600c;
            --amber-soft: #fff5e5;
            --red: #bb3f4c;
            --red-soft: #fdefef;
            --radius: 14px;
            --shadow: 0 8px 28px #18294d09
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.6 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif
        }

        button, input, select, textarea {
            font: inherit
        }

        button, a, input, select, textarea {
            -webkit-tap-highlight-color: transparent
        }

        button, a {
            touch-action: manipulation
        }

        button {
            cursor: pointer
        }

        a {
            color: var(--primary);
            text-decoration: none
        }

        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid #8aa7ff;
            outline-offset: 3px
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .48
        }

        button {
            border: 0
        }

        button, a {
            transition: background .16s, color .16s, border-color .16s, box-shadow .16s
        }

        h1, h2, h3, p {
            margin: 0
        }

        h1 {
            font-size: 27px;
            line-height: 1.4;
            letter-spacing: -.6px
        }

        h2 {
            font-size: 16px
        }

        h3 {
            font-size: 14px
        }

        small, .small {
            font-size: 12px
        }

        .muted {
            color: var(--muted)
        }

        .mono {
            font: 12px/1.6 Consolas, "SFMono-Regular", monospace
        }

        .nowrap {
            white-space: nowrap
        }

        .icon {
            width: 19px;
            height: 19px;
            flex: none;
            vertical-align: middle;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0)
        }

        .skip {
            position: fixed;
            top: -60px;
            left: 245px;
            z-index: 100;
            background: white;
            padding: 12px
        }

        .skip:focus {
            top: 12px
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: 222px;
            background: var(--nav);
            color: #b4bfd1;
            display: flex;
            flex-direction: column;
            padding: 25px 16px 18px;
            z-index: 30
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 12px 28px;
            color: #fff
        }

        .brand-mark {
            height: 35px;
            width: 35px;
            display: grid;
            place-items: center;
            background: #355be8;
            border-radius: 10px;
            box-shadow: 0 0 0 5px #355be81c
        }

        .brand-mark .icon {
            width: 24px;
            height: 24px
        }

        .brand strong {
            font-size: 21px;
            font-weight: 650;
            letter-spacing: 3px
        }

        .brand small {
            display: block;
            color: #8997b0;
            font-size: 10px;
            letter-spacing: 1.7px;
            margin-top: 0
        }

        .nav-label {
            padding: 18px 14px 8px;
            color: #7f8ca6;
            font-size: 10px;
            letter-spacing: 1.5px
        }

        .nav {
            display: grid;
            gap: 5px
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 8px;
            color: #b4bfd1;
            font-size: 13px;
            position: relative
        }

        .nav a:hover {
            background: #1b2942;
            color: #fff
        }

        .nav a.active {
            background: #243c72;
            color: white
        }

        .nav a.active:before {
            content: "";
            width: 3px;
            height: 17px;
            position: absolute;
            left: 0;
            border-radius: 3px;
            background: #8ca6ff
        }

        .nav-count {
            margin-left: auto;
            border-radius: 5px;
            background: #ffffff12;
            padding: 0 6px;
            font-size: 10px;
            color: #b9caf8
        }

        .sidebar-foot {
            margin-top: auto;
            padding-top: 20px
        }

        .scope-note {
            border: 1px solid #ffffff14;
            border-radius: 10px;
            padding: 12px;
            font-size: 11px;
            color: #92a2bc;
            margin: 15px 5px
        }

        .scope-note strong {
            display: block;
            color: #cdd7e8;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #304361;
            color: #d9e5ff;
            display: grid;
            place-items: center;
            font-size: 12px
        }

        .user b {
            display: block;
            color: #e9edf7;
            font-size: 12px;
            font-weight: 500
        }

        .user small {
            font-size: 10px;
            color: #8d9cb5
        }

        .main-shell {
            margin-left: 222px;
            min-height: 100vh
        }

        .topbar {
            height: 72px;
            border-bottom: 1px solid var(--line);
            background: #ffffffeb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 34px;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(14px)
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap
        }

        .breadcrumb strong {
            font-weight: 500;
            color: var(--ink)
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .demo-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: var(--muted)
        }

        .dot {
            width: 6px;
            height: 6px;
            display: inline-block;
            background: var(--green);
            border-radius: 100%
        }

        .divider {
            width: 1px;
            height: 20px;
            background: var(--line)
        }

        .icon-button {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            background: transparent;
            border-radius: 8px;
            color: var(--muted)
        }

        .icon-button:hover {
            background: #eef2f8;
            color: var(--ink)
        }

        .mobile-menu {
            display: none
        }

        main {
            padding: 30px 34px 36px;
            max-width: 1680px;
            margin: auto
        }

        .page-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px
        }

        .eyebrow {
            font-size: 10px;
            color: var(--primary);
            font-weight: 650;
            letter-spacing: 2px;
            margin-bottom: 8px
        }

        .page-head p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 7px;
            max-width: 720px
        }

        .actions {
            display: flex;
            gap: 9px;
            align-items: center;
            flex-wrap: wrap
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid var(--line);
            background: white;
            border-radius: 8px;
            padding: 8px 13px;
            color: var(--ink);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            min-height: 36px
        }

        .btn:hover {
            background: #f5f7fb;
            border-color: #c5cede
        }

        .btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 3px 7px #355be821
        }

        .btn.primary:hover {
            background: #294cd1
        }

        .btn.danger {
            color: var(--red);
            border-color: #efd2d7
        }

        .btn.small {
            padding: 5px 10px;
            min-height: 29px;
            font-size: 11px
        }

        .btn.ghost {
            background: transparent;
            border-color: transparent;
            color: var(--muted)
        }

        .btn .icon {
            width: 15px;
            height: 15px
        }

        .text-button {
            color: var(--primary);
            background: transparent;
            padding: 3px;
            font-size: 12px
        }

        .text-button:hover {
            text-decoration: underline
        }

        .panel {
            background: white;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            min-width: 0;
            overflow: hidden
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 19px 21px;
            border-bottom: 1px solid var(--line)
        }

        .panel-body {
            padding: 21px
        }

        .panel-head .caption {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px
        }

        .section-gap {
            margin-top: 22px
        }

        .grid {
            display: grid;
            gap: 18px
        }

        .grid-2 {
            grid-template-columns:1.4fr 1fr
        }

        .grid-3 {
            grid-template-columns:repeat(3, minmax(0, 1fr))
        }

        .grid-4 {
            grid-template-columns:repeat(4, minmax(0, 1fr))
        }

        .stats {
            display: grid;
            grid-template-columns:repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 22px
        }

        .stat {
            padding: 20px 22px;
            background: white;
            border: 1px solid var(--line);
            border-radius: 12px
        }

        .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 12px
        }

        .stat-top .icon {
            color: #7e8eb0
        }

        .stat-number {
            font-size: 30px;
            line-height: 1.25;
            font-weight: 650;
            letter-spacing: -1px;
            margin-top: 11px;
            font-variant-numeric: tabular-nums
        }

        .stat-foot {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px
        }

        .stat-foot .good {
            color: var(--green)
        }

        .entry {
            padding: 21px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: white;
            text-align: left;
            position: relative;
            min-width: 0;
            color: var(--ink);
            display: block
        }

        .entry:hover {
            border-color: #b8c9ff;
            box-shadow: 0 6px 18px #2b48a20b;
            background: #fafbff
        }

        .entry .entry-icon {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--primary-soft);
            color: var(--primary);
            margin-bottom: 14px
        }

        .entry.teal .entry-icon {
            background: #eaf7f4;
            color: #12816f
        }

        .entry.violet .entry-icon {
            background: #f1edfc;
            color: #8156bb
        }

        .entry h3 {
            font-size: 15px;
            margin-bottom: 7px
        }

        .entry p {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.8;
            padding-right: 15px
        }

        .entry .arrow {
            position: absolute;
            right: 18px;
            top: 24px;
            color: #8995ab
        }

        .entry small {
            display: block;
            margin-top: 16px;
            color: #52627e;
            font-size: 11px
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 13px
        }

        .section-title span {
            font-size: 11px;
            color: var(--muted)
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            background: #f1f4f8;
            border: 1px solid #e8ecf2;
            color: #596880;
            border-radius: 5px;
            white-space: nowrap;
            font-size: 10px;
            font-weight: 500;
            line-height: 1.5
        }

        .chip.blue {
            background: var(--primary-soft);
            border-color: #e0e7ff;
            color: #3c5fca
        }

        .chip.green {
            background: var(--green-soft);
            border-color: #d8ede4;
            color: var(--green)
        }

        .chip.amber {
            background: var(--amber-soft);
            border-color: #f5e6cf;
            color: var(--amber)
        }

        .chip.red {
            background: var(--red-soft);
            border-color: #f2dfe2;
            color: var(--red)
        }

        .chip.purple {
            background: #f3effb;
            border-color: #e7def5;
            color: #7952a6
        }

        .chip-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor
        }

        .table-scroll {
            overflow: auto
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
            text-align: left
        }

        th {
            background: #fafbfe;
            color: #697890;
            font-size: 10px;
            letter-spacing: .3px;
            font-weight: 500;
            padding: 11px 20px;
            white-space: nowrap;
            border-bottom: 1px solid var(--line)
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #edf0f5;
            vertical-align: middle
        }

        tbody tr:last-child td {
            border: 0
        }

        tbody tr:hover {
            background: #fcfdff
        }

        .cell-title {
            font-weight: 550;
            color: var(--ink);
            display: block;
            margin-bottom: 4px;
            font-size: 12px
        }

        .cell-meta {
            font-size: 10px;
            color: var(--muted)
        }

        .task-name {
            min-width: 225px
        }

        .task-name a:hover {
            color: var(--primary)
        }

        .mini-progress {
            width: 96px;
            height: 4px;
            border-radius: 4px;
            background: #edf1f7;
            margin-top: 6px;
            overflow: hidden
        }

        .mini-progress span {
            height: 100%;
            display: block;
            background: #6885ef;
            border-radius: 4px
        }

        .table-footer {
            padding: 12px 20px;
            font-size: 10px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--line)
        }

        .filterbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap
        }

        .searchbox {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            background: white;
            border-radius: 7px;
            padding: 7px 10px;
            min-width: 220px
        }

        .searchbox .icon {
            width: 15px;
            color: #8a97ad
        }

        .searchbox input {
            border: 0;
            outline: 0;
            font-size: 12px;
            width: 100%;
            background: transparent
        }

        .filterbar select {
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 7px 28px 7px 10px;
            background: white;
            color: #526078;
            font-size: 12px
        }

        .filterbar .spacer {
            flex: 1
        }

        .tabs {
            display: flex;
            gap: 22px;
            padding: 0 20px;
            border-bottom: 1px solid var(--line);
            overflow-x: auto
        }

        .tab {
            background: transparent;
            padding: 15px 2px 13px;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap
        }

        .tab.active {
            color: var(--primary);
            border-color: var(--primary);
            font-weight: 600
        }

        .count-small {
            background: #eef1f7;
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 10px;
            margin-left: 6px
        }

        .empty {
            padding: 48px 20px;
            text-align: center;
            color: var(--muted)
        }

        .empty .icon {
            width: 35px;
            height: 35px;
            color: #a5b3cd;
            margin-bottom: 12px
        }

        .empty b {
            display: block;
            color: #586b89;
            margin-bottom: 5px;
            font-weight: 500
        }

        .empty p {
            font-size: 12px
        }

        .empty .btn {
            margin-top: 15px
        }

        .list-row {
            padding: 15px 20px;
            border-bottom: 1px solid #edf0f5;
            display: flex;
            gap: 12px;
            align-items: center
        }

        .list-row:last-child {
            border: 0
        }

        .list-row .grow {
            flex: 1;
            min-width: 0
        }

        .list-row p {
            font-size: 12px;
            font-weight: 500
        }

        .list-row small {
            font-size: 10px;
            color: var(--muted)
        }

        .risk-mark {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            color: var(--red);
            background: var(--red-soft)
        }

        .risk-mark .icon {
            width: 16px
        }

        .todo-mark {
            height: 30px;
            width: 30px;
            border-radius: 8px;
            background: var(--primary-soft);
            color: var(--primary);
            display: grid;
            place-items: center
        }

        .todo-mark .icon {
            width: 16px
        }

        .coverage-row {
            display: grid;
            grid-template-columns:110px 1fr 42px;
            gap: 14px;
            align-items: center;
            font-size: 11px;
            margin-bottom: 18px
        }

        .coverage-row:last-child {
            margin-bottom: 0
        }

        .coverage-track {
            height: 7px;
            background: #eef1f8;
            border-radius: 7px;
            overflow: hidden
        }

        .coverage-track span {
            display: block;
            height: 100%;
            background: #758cf1;
            border-radius: 7px
        }

        .notice {
            padding: 12px 15px;
            background: #eef3ff;
            border: 1px solid #dfe7ff;
            border-radius: 9px;
            font-size: 12px;
            color: #526894;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 18px
        }

        .notice.amber {
            background: #fff8ed;
            border-color: #f2e5cc;
            color: #8a6124
        }

        .notice .icon {
            width: 16px;
            height: 16px;
            margin-top: 2px
        }

        .notice p {
            flex: 1
        }

        .kv {
            display: grid;
            grid-template-columns:100px 1fr;
            gap: 10px 16px;
            font-size: 12px;
            align-items: start
        }

        .kv dt {
            color: var(--muted)
        }

        .kv dd {
            margin: 0;
            overflow-wrap: anywhere
        }

        .kv.compact {
            grid-template-columns:78px 1fr;
            font-size: 11px;
            gap: 9px
        }

        .thin-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 12px
        }

        .taglist {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .run-subhead {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px
        }

        .run-layout {
            display: grid;
            grid-template-columns:220px minmax(300px, 1fr) 278px;
            gap: 16px;
            align-items: start
        }

        .sessions .session-btn {
            display: block;
            background: transparent;
            text-align: left;
            width: 100%;
            padding: 15px 16px;
            border-bottom: 1px solid var(--line);
            color: var(--ink)
        }

        .sessions .session-btn.active {
            background: #f0f4ff;
            border-left: 3px solid var(--primary);
            padding-left: 13px
        }

        .session-btn b {
            display: block;
            font-size: 11px;
            font-weight: 550;
            margin-bottom: 6px
        }

        .session-btn small {
            font-size: 10px;
            color: var(--muted)
        }

        .session-group {
            padding: 12px 15px 4px;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 1px
        }

        .conversation {
            padding: 20px;
            max-height: 690px;
            overflow: auto
        }

        .turn-label {
            display: flex;
            gap: 12px;
            align-items: center;
            color: #8c98ad;
            font-size: 10px;
            margin: 4px 0 17px
        }

        .turn-label:before, .turn-label:after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--line)
        }

        .message {
            margin-bottom: 16px
        }

        .message-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 7px
        }

        .message-title .role-avatar {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            background: #edf2fc;
            border-radius: 6px;
            color: var(--primary)
        }

        .message-title .role-avatar .icon {
            width: 12px;
            height: 12px
        }

        .bubble {
            border: 1px solid var(--line);

            return head(title, desc, '<button class="btn primary" data-action="create" data-type="' + type + '">' + icon('plus') + '新建' + typeName[type] + '</button>', type === 'RED_TEAM_EXPLORATION' ? 'ADAPTIVE RED TEAMING' : 'BENCHMARK & REGRESSION') + '<div class="stats">' + stat('全部任务', list.length, '仅统计当前任务类型', 'folder') + stat('运行中', list.filter(t => t.status === 'RUNNING').length, '目标执行受预算约束', 'play') + stat('待授权', list.filter(t => t.status === 'WAITING_APPROVAL').length, '确认范围与预算后启动', 'checklist') + stat('等待核对', list.filter(t => t.status === 'BLOCKED').length, '未知结果不会自动重发', 'alert') + '</div><section class="panel">' + filterBar(key, ['RUNNING', 'WAITING_APPROVAL', 'READY', 'PAUSED', 'BLOCKED', 'COMPLETED', 'STOPPED']) + taskTable(filtered(list, key)) + '</section>';
        }

        function budgetPanel(t) {
            const b = t.budget;
            return '<section class="panel section-gap"><div class="panel-head"><h2>预算与消耗</h2><span class="small muted">包含重试、判定与复现 · 不自动扩额</span></div><div class="panel-body budget-grid">' + [['目标请求', b.targetCalls, b.maxTargetCalls, '次'], ['智能体与判定请求', b.agentCalls, b.maxAgentCalls, '次'], ['Token 用量', b.tokens, b.maxTokens, ''], ['费用', b.cost, b.maxCost, '元']].map(row => '<div class="budget-item"><div class="row"><span class="muted">' + row[0] + '</span><span class="mono">' + (row[3] === '元' ? cash(row[1]) : int(row[1])) + ' / ' + int(row[2]) + '</span></div><div class="mini-progress"><span style="width:' + (row[2] ? Math.min(100, row[1] / row[2] * 100) : 0) + '%"></span></div></div>').join('') + '</div></section>';
        }

        function runActions(t) {
            let out = '';
            if (t.status === 'WAITING_APPROVAL') out += button('审核计划', 'approve-dialog', t.id, 'primary', 'check');
            if (t.status === 'READY') out += button('启动运行', 'start', t.id, 'primary', 'play');
            if (t.status === 'RUNNING') out += button('暂停', 'pause', t.id, '', 'pause');
            if (t.status === 'PAUSED') out += button('恢复', 'resume', t.id, 'primary', 'play');
            if (t.status === 'BLOCKED') out += button('核对执行状态', 'resolve-unknown', t.id, '', 'alert');
            if (['RUNNING', 'PAUSED', 'BLOCKED', 'QUEUED'].includes(t.status)) out += button('停止', 'stop-dialog', t.id, 'danger', 'stop');
            if (['PAUSING', 'STOPPING'].includes(t.status)) out += '<button class="btn" disabled>' + (t.status === 'PAUSING' ? '正在保存检查点…' : '正在收敛在途请求…') + '</button>';
            out += button('生成报告', 'generate-report', t.id, '', 'report');
            return out;
        }

        function runPage(id) {
            const t = find(db.tasks, id);
            if (!t) return empty('任务不存在', '返回工作台或重置演示数据。');
            const target = find(db.targets, t.targetId);
            let out = head(t.name, typeName[t.type] + ' / ' + t.id, runActions(t), 'RUN DETAILS');
            out += '<div class="run-subhead" style="margin-top:-12px;margin-bottom:20px">' + badge(t.status) + (target ? '<span class="chip">' + esc(target.name + ' ' + t.targetVersion) + '</span>' : '<span class="chip purple">不调用被测目标</span>') + (t.mode ? '<span class="chip">' + esc(modeName[t.mode]) + '</span>' : '') + t.risks.map(r => '<span class="chip">' + esc(find(db.rules, r)?.name) + '</span>').join('') + '<span class="small muted">计划 ' + esc(t.planVersion) + ' · ' + esc(t.owner) + '</span></div>';
            if (t.stopReason) out += notice(t.stopReason, t.status === 'BLOCKED');
            if (t.status === 'WAITING_APPROVAL') out += notice('计划尚未授权。审核时确认目标、风险范围、策略及预算，批准后仍需启动。');
            if (t.status === 'QUEUED') out += notice('已排队，计划时间：' + (t.schedule || '等待调度') + '。演示中可通过“触发计划”提前演示排队后的流程。');
            out += '<div class="mock-toolbar"><span>' + icon('info') + ' 演示控制 · 无真实模型或目标请求</span><div class="actions">' + (t.type !== 'SAMPLE_PRODUCTION' ? '<label for="outcome">下一次观察</label><select id="outcome"><option value="risk"' + (db.mock.nextOutcome === 'risk' ? ' selected' : '') + '>观察到风险</option><option value="safe"' + (db.mock.nextOutcome === 'safe' ? ' selected' : '') + '>未观察到风险</option><option value="unknown"' + (db.mock.nextOutcome === 'unknown' ? ' selected' : '') + '>执行结果未知</option><option value="judgeError"' + (db.mock.nextOutcome === 'judgeError' ? ' selected' : '') + '>Judge 失败</option><option value="executionError"' + (db.mock.nextOutcome === 'executionError' ? ' selected' : '') + '>目标调用失败</option></select>' : '') + (t.status === 'RUNNING' ? button(t.type === 'SAMPLE_PRODUCTION' ? '生成下一个候选' : t.type === 'STANDARD_EVALUATION' ? '执行下一个用例' : '推进一轮', 'tick', t.id, 'small', 'play') : '') + (t.status === 'QUEUED' ? button('触发计划', 'trigger-schedule', t.id, 'small', 'clock') : '') + '</div></div>';
            if (t.type === 'RED_TEAM_EXPLORATION') out += redteamRun(t);
            else if (t.type === 'SAMPLE_PRODUCTION') out += '<section class="panel"><div class="panel-head"><h2>生产配置</h2><span class="chip purple">只生成候选</span></div><div class="panel-body"><dl class="kv"><dt>专家种子</dt><dd>' + esc(t.seed) + '</dd><dt>变异方式</dt><dd>' + esc(t.mutations) + '</dd><dt>生成数量</dt><dd>' + t.quantity + ' 条</dd><dt>计划时间</dt><dd>' + esc(t.schedule || '手动启动') + ' · 本地时区</dd></dl></div></section><div class="section-title"><h2>候选样本</h2><span>审核通过后才进入正式用例库</span></div>' + candidatesGrid(db.candidates.filter(c => c.taskId === t.id));
            else out += standardRun(t);
            out += budgetPanel(t);
            out += '<section class="panel section-gap"><div class="panel-head"><h2>运行事件</h2><span class="small muted">动作与事实摘要</span></div><div class="panel-body">' + db.events.filter(e => e.taskId === t.id).slice(0, 12).map(e => '<div class="event-line"><time>' + esc(e.time) + '</time><p>' + esc(e.text) + '</p></div>').join('') + '</div></section>';
            return out;
        }

        function redteamRun(t) {
            const sessions = db.sessions.filter(s => s.taskId === t.id);
            let s = find(sessions, selectedSession[t.id]) || sessions[0];
            if (s) selectedSession[t.id] = s.id;
            const findings = db.findings.filter(f => f.taskId === t.id && (!s || f.sessionId === s.id));
            const last = s?.probes.at(-1);
            let out = '<div class="run-layout"><section class="panel sessions"><div class="panel-head"><h2>攻击轨迹</h2><span class="count-small">' + sessions.length + '</span></div><div class="session-group">尝试与会话</div>' + sessions.map(x => '<button class="session-btn ' + (s?.id === x.id ? 'active' : '') + '" data-action="select-session" data-id="' + attr(x.id) + '" data-task="' + attr(t.id) + '"><b>' + esc(x.name) + '</b><small>' + x.probes.length + ' 轮 · ' + esc(x.status === 'ACTIVE' ? '进行中' : stateLabels[x.status] || x.status) + '</small><div style="margin-top:7px">' + badge(window.RedTeamMock.sessionVerdict(x)) + '</div></button>').join('') + (!sessions.length ? '<div class="panel-body small muted">启动并推进一次探测后，轨迹将显示在这里。</div>' : '') + '</section>';
            out += '<section class="panel"><div class="panel-head"><div><h2>' + esc(s?.name || '等待第一次探测') + '</h2><div class="caption">' + (t.mode === 'ADAPTIVE_MULTI_TURN' ? '保留同一目标会话上下文' : '每次目标探测使用干净上下文') + '</div></div>' + icon('branch') + '</div><label class="mobile-session-select filterbar" style="display:none">选择会话 <select id="sessionSelect">' + sessions.map(x => '<option value="' + attr(x.id) + '"' + (s?.id === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select></label><div class="conversation">' + (s ? s.probes.map((p, i) => '<div class="turn-label">TURN ' + String(i + 1).padStart(2, '0') + ' · ' + esc(p.createdAt) + '</div><div class="message"><div class="message-title"><span class="role-avatar">' + icon('radar') + '</span>攻击输入 <span class="mono">' + esc(p.id) + '</span></div><div class="bubble">' + esc(p.input) + '</div></div><div class="message target"><div class="message-title"><span class="role-avatar">' + icon('bot') + '</span>目标响应 ' + badge(p.executionStatus) + '</div><div class="bubble">' + esc(p.output) + '</div></div><div class="observation">' + badge(p.verdict) + '<div>' + esc(p.reason) + '</div><button class="text-button" data-action="evidence" data-id="' + attr(p.id) + '">查看原始证据 ' + icon('arrow') + '</button></div>').join('') : empty('会话尚未开始', '启动后使用演示控制推进一次探测。')) + '</div></section>';
            out += '<aside class="run-insight"><section class="panel"><div class="panel-head"><h2>观察与判定</h2>' + icon('shield') + '</div><div class="verdict-card">' + (last ? '<div class="verdict-banner" style="' + (last.verdict !== 'RISK_OBSERVED' ? 'background:#f3f6fc;border-color:#e1e7f2' : '') + '"><p style="' + (last.verdict !== 'RISK_OBSERVED' ? 'color:#526582' : '') + '">' + esc(stateLabels[last.verdict]) + '</p><small>当前观察与最终确认分别记录</small></div><dl class="kv compact"><dt>判定范围</dt><dd>' + (t.mode === 'ADAPTIVE_MULTI_TURN' ? '会话 / 单次观察' : '单次探测') + '</dd><dt>规则版本</dt><dd>' + esc(find(t.ruleSnapshots || db.rules, s.risk)?.version) + '</dd><dt>证据来源</dt><dd>' + (last.executionStatus === 'UNKNOWN' ? '执行结果尚不可用' : '目标响应与运行记录') + '</dd><dt>动作依据</dt><dd>' + esc(last.reason) + '</dd></dl>' : '<p class="small muted">获取目标响应后生成观察，不预设安全结论。</p>') + '</div></section><section class="panel section-gap"><div class="panel-head"><h2>关联发现</h2><span class="count-small">' + findings.length + '</span></div>' + (findings.length ? findings.map(f => '<div class="panel-body"><div class="taglist">' + badge(f.severity) + badge(f.status) + '</div><h3 style="margin:12px 0">' + esc(f.title) + '</h3><a href="#/finding/' + attr(f.id) + '" class="text-button">进入证据与复核 ' + icon('arrow') + '</a></div>').join('') : empty('暂无关联发现', '未观察到风险不代表目标整体安全。')) + '</section></aside></div>';
            return out;
        }

        function standardRun(t) {
            const results = db.results.filter(r => r.taskId === t.id);
            const risk = results.filter(r => r.verdict === 'RISK_OBSERVED').length,
                safe = results.filter(r => r.verdict === 'NO_RISK_OBSERVED').length;
            const baseline = (t.baseline || []).map(old => '<div class="list-row"><div class="grow"><p>' + esc(old.caseId) + ' · ' + esc(old.label || '修复前记录') + '</p><small>目标 ' + esc(old.targetVersion) + ' · ' + badge(old.verdict) + '</small></div></div>').join('');
            return '<div class="stats">' + stat('已执行用例', results.length, '固定用例集 ' + (t.setVersion || ''), 'checklist') + stat('已观测风险', risk, '有效已判定用例 ' + (risk + safe) + ' 项', 'flag') + stat('无法判断', results.filter(r => r.verdict === 'INCONCLUSIVE').length, '不计为无风险', 'info') + stat('执行错误', results.filter(r => r.verdict === 'EXECUTION_ERROR').length, '与安全判定分开统计', 'alert') + '</div>' + notice('本次已观测风险率：' + (risk + safe ? (risk / (risk + safe) * 100).toFixed(1) + '%' : '不适用') + '。分母只包含明确命中与未观察到风险的用例；错误、未知和待定独立展示。') + (t.purpose === 'REGRESSION' ? '<section class="panel section-gap"><div class="panel-head"><h2>修复前对照</h2><span class="small muted">对照记录不替代当前回归结果</span></div><div class="panel-body">' + (baseline || empty('暂无修复前对照', '本次回归只比较当前固定用例结果。')) + '</div></section>' : '') + '<section class="panel"><div class="panel-head"><h2>固定用例执行结果</h2><span class="chip">' + esc(t.purpose === 'REGRESSION' ? '修复回归' : '标准基准') + '</span></div>' + (results.length ? '<div class="table-scroll"><table><thead><tr><th>用例</th><th>执行状态</th><th>判定</th><th>结果摘要</th><th>证据</th></tr></thead><tbody>' + results.map(r => '<tr><td><span class="cell-title">' + esc(r.caseName) + '</span><span class="mono muted">' + esc(r.caseId) + ' · ' + esc(r.caseVersion || '未记录') + '</span></td><td>' + badge(r.executionStatus || (r.verdict === 'EXECUTION_ERROR' ? 'FAILED' : 'SUCCEEDED')) + '</td><td>' + badge(r.verdict) + '</td><td>' + esc(r.response) + '</td><td><button class="text-button" data-action="result" data-id="' + attr(r.id) + '">查看</button></td></tr>').join('') + '</tbody></table></div>' : empty('暂无执行结果', '启动后推进固定用例执行。')) + '</section>';
        }

        function candidatesGrid(list) {
            return list.length ? '<div class="candidate-grid">' + list.map(c => '<article class="panel candidate"><div class="card-top"><label class="actions"><input class="checkbox" type="checkbox" data-candidate="' + attr(c.id) + '" aria-label="选择' + attr(c.title) + '"' + (checkedCandidates.has(c.id) ? ' checked' : '') + (['APPROVED', 'REJECTED'].includes(c.status) ? ' disabled' : '') + '><span class="mono muted">' + esc(c.id) + '</span></label>' + badge(c.status) + '</div><h3>' + esc(c.title) + '</h3><p class="sample-text">' + esc(c.content) + '</p><div class="taglist">' + badge(c.quality) + '<span class="chip">' + esc(find(db.rules, c.risk)?.name) + '</span></div><p class="small muted">' + esc(c.feedback) + '</p><div class="lineage">' + esc(c.lineage) + '</div><div class="actions">' + button('查看与修改', 'candidate', c.id, 'small') + (!['APPROVED', 'REJECTED'].includes(c.status) ? '<button class="btn small primary" data-action="approve-sample" data-id="' + attr(c.id) + '"' + (c.quality !== 'PASS' ? ' disabled title="请先修改并重新质检"' : '') + '>审核通过</button>' : '') + '</div></article>').join('') + '</div>' : empty('没有符合条件的候选', '通过样本工厂生成，或从确认发现中沉淀。');
        }

        function factoryPage() {
            const tab = tabs.factory || 'batches';
            const c = db.candidates;
            return head('样本工厂', '从一个专家种子出发，沉淀可审核、可复用的测试资产。', '<button class="btn primary" data-action="create" data-type="SAMPLE_PRODUCTION">' + icon('plus') + '新建生产任务</button>', 'SEED → CANDIDATE → CASE') + '<div class="stats">' + stat('候选样本', c.length, '包含历史审核状态', 'layers') + stat('待人工审核', c.filter(x => x.status === 'PENDING').length, '质检通过不等于已启用', 'checklist') + stat('已批准入库', c.filter(x => x.status === 'APPROVED').length, '正式用例可用于标准评测', 'check') + stat('待修改', c.filter(x => x.status === 'REVISION').length, '保留专家反馈与来源', 'spark') + '</div><section class="panel"><div class="tabs">' + tabButton('factory', 'batches', '生产批次', tab) + tabButton('factory', 'candidates', '候选审核', tab) + '</div>' + (tab === 'batches' ? taskTable(db.tasks.filter(t => t.type === 'SAMPLE_PRODUCTION')) : filterBar('candidates', ['PENDING', 'APPROVED', 'REVISION', 'REJECTED'])) + '</section>' + (tab === 'candidates' ? '<div class="section-title"><span>已选择 ' + checkedCandidates.size + ' 项候选</span><div class="actions">' + button('批量通过', 'batch-approve', '', 'small', 'check') + button('清除选择', 'clear-selection', '', 'small') + '</div></div>' + candidatesGrid(filtered(c, 'candidates')) : '');
        }

        function tabButton(group, id, label, current, count) {
            return '<button class="tab ' + (current === id ? 'active' : '') + '" data-action="tab" data-group="' + group + '" data-tab="' + id + '">' + label + (count !== undefined ? '<span class="count-small">' + count + '</span>' : '') + '</button>';
        }

        function findingsPage() {
            const list = filtered(db.findings, 'findings');
            return head('风险发现', '把疑似命中转化为有证据、可复现、可回归的问题。', button('查看回归任务', 'go-standard', '', '', 'refresh'), 'FINDINGS & EVIDENCE') + '<div class="stats">' + stat('待复核', db.findings.filter(f => f.status === 'SUSPECTED').length, '原始判定不会被复核覆盖', 'flag') + stat('确认发现', db.findings.filter(f => f.status === 'CONFIRMED').length, '包含已修复的问题', 'shield') + stat('正在整改', db.findings.filter(f => f.remediation === 'IN_PROGRESS').length, '已分配研发负责人', 'user') + stat('验证修复', db.findings.filter(f => f.remediation === 'RESOLVED').length, '固定用例回归后确认', 'check') + '</div><section class="panel">' + filterBar('findings', ['SUSPECTED', 'CONFIRMED', 'DISMISSED', 'INCONCLUSIVE']) + (list.length ? '<div class="table-scroll"><table><thead><tr><th>风险发现</th><th>级别 / 类型</th><th>确认状态</th><th>整改状态</th><th>负责人</th><th>操作</th></tr></thead><tbody>' + list.map(f => '<tr><td class="task-name"><a class="cell-title" href="#/finding/' + attr(f.id) + '">' + esc(f.title) + '</a><span class="cell-meta">' + esc(f.firstSeen) + ' · ' + esc(find(db.targets, f.targetId)?.name) + '</span></td><td>' + badge(f.severity) + '<div class="cell-meta" style="margin-top:6px">' + esc(find(db.rules, f.risk)?.name) + '</div></td><td>' + badge(f.status) + '</td><td>' + badge(f.remediation) + '</td><td>' + esc(f.owner) + '</td><td><a class="text-button" href="#/finding/' + attr(f.id) + '">证据与复核</a></td></tr>').join('') + '</tbody></table></div>' : empty('没有符合条件的发现')) + '</section>';
        }

        function findingPage(id) {
            const f = find(db.findings, id);
            if (!f) return empty('发现不存在');
            const s = find(db.sessions, f.sessionId), probe = s?.probes.find(p => p.id === f.probeId),
                sourceTask = find(db.tasks, f.taskId);
            const cases = db.cases.filter(c => c.sourceFinding === f.id),
                candidate = db.candidates.find(c => c.sourceFinding === f.id && c.status !== 'REJECTED');
            const regressions = db.tasks.filter(t => t.findingId === f.id).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
            const latest = window.RedTeamMock.getCurrentRegression(f.id),
                latestResults = latest ? db.results.filter(r => r.taskId === latest.id) : [],
                latestFailed = !!latest && latest.status === 'COMPLETED' && latestResults.some(r => r.verdict !== 'NO_RISK_OBSERVED'),
                latestFinished = !!latest && latest.status === 'COMPLETED';
            const sourceCase = sourceTask?.caseSnapshots?.find(c => c.id === f.caseId);

        function download(name, content, type) {

            a.download = name;

                }, '审核通过，已进入正式用例库');
                else if (action === 'batch-confirm') {
                    for (const key of checkedCandidates) {
                        result = await call('reviewSample', {id: key, decision: 'approve'});
                        if (!result.ok) break;
                    }
                    checkedCandidates.clear();
                    closeModal();
                    render();
                    toast('已处理所选候选');
                } else if (action === 'replay-confirm') {
                    result = await call('replay', {id}, '独立复现已开始');
                    if (result.ok) closeModal();
                } else if (action === 'make-candidate') await call('makeCandidate', {id}, '已创建候选回归用例，请到资产页审核');
                else if (action === 'toggle-case') {
                    result = await call('toggleCase', {id}, '正式用例状态已变更');
                    if (result.ok) closeModal();
                } else if (action === 'experience-approve' || action === 'experience-reject') {
                    result = await call('reviewExperience', {
                        id,
                        approve: action === 'experience-approve'
                    }, '经验审核已记录');
                    if (result.ok) closeModal();
                } else if (action === 'generate-report') {
                    result = await call('report', {id}, '报告草稿已生成');
                    if (result.ok) go('report/' + result.value);
                } else if (action === 'publish-report') {
                    result = await call('publishReport', {id}, '报告快照已确认');
                    if (result.ok) closeModal();
                }
            } finally {
                busy = false;
                el.disabled = false;
            }
        });

        function openExperience(id) {
            const x = find(db.experiences, id);
            if (!x) return;
            openModal('经验审核', '仅将经审核的事实归纳用于共享检索。', '<div class="taglist">' + badge(x.status) + '<span class="chip">' + esc(x.scope) + '</span></div><h3 style="margin-top:16px">' + esc(x.title) + '</h3><p class="small muted" style="margin-top:12px">' + esc(x.text) + '</p><div class="form-section"><h3>证据来源</h3><p class="small">' + esc(x.evidence) + '</p><a href="#/finding/' + attr(x.findingId) + '" data-action="close-link">查看关联发现</a></div>', x.status === 'PENDING' ? button('拒绝', 'experience-reject', id, 'danger') + button('批准共享', 'experience-approve', id, 'primary') : button('关闭', 'close'));
        }

        document.addEventListener('open-experience', e => openExperience(e.detail));
        document.addEventListener('submit', async e => {
            const form = e.target;
            if (!form.closest('#modalRoot')) return;
            e.preventDefault();
            if (busy) return;
            if (!form.reportValidity()) return;
            const data = Object.fromEntries(new FormData(form).entries());
            if (form.getAttribute('id') === 'taskWizard') {
                captureWizard();
                if (wizard.step === 1 && !wizard.data.risks.length) {
                    formError('请至少选择一种受支持的风险');
                    return;
                }
                if (wizard.step < 2) {
                    wizard.step++;
                    renderWizard();
                    return;
                }
            }
            busy = true;
            const submit = $('#modalRoot button[type=submit]');
            if (submit) submit.disabled = true;
            try {
                let r;
                if (form.getAttribute('id') === 'taskWizard') {
                    r = await call('createTask', wizard.data);
                    if (r.ok) {
                        closeModal();
                        go('run/' + r.value);
                        toast('计划已创建，等待运行授权');
                    }
                } else if (form.getAttribute('id') === 'candidateEdit') {
                    r = await call('reviewSample', {...data, decision: 'edit'}, '已保存修改，重新进入待审核');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'sampleReview') {
                    r = await call('reviewSample', data, '审核意见已保存');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'findingReview') {
                    r = await call('reviewFinding', data, '已保存独立意见，原始判定保留');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'unknownForm') {
                    r = await call('resolveUnknown', data, '核对依据已记录，将使用新会话');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'followupForm') {
                    r = await call('recordFollowup', data, '结果跟进已记录，原始结论未改变');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'assignForm') {
                    r = await call('assign', data, '整改负责人已分配');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'regressionForm') {
                    r = await call('regression', data);
                    if (r.ok) {
                        closeModal();
                        go('run/' + r.value);
                        toast('回归计划已创建，等待授权');
                    }
                } else if (form.getAttribute('id') === 'resolveForm') {
                    r = await call('resolveFinding', data, '已根据当前指定回归确认修复');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'acceptRiskForm') {
                    r = await call('acceptRisk', data, '已记录负责人接受风险，不计为技术修复');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'reopenForm') {
                    r = await call('reopenFinding', data, '问题已重新打开');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'targetForm') {
                    r = await call('saveTarget', {
                        ...data,
                        multiTurn: data.multiTurn === 'on',
                        reset: data.reset === 'on',
                        trace: data.trace === 'on'
                    }, '已创建新的目标快照');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'ruleForm') {
                    r = await call('saveRule', data, '规则新版本已保存');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'strategyForm') {
                    r = await call('saveStrategy', data, '策略新版本已保存');
                    if (r.ok) closeModal();
                } else if (form.getAttribute('id') === 'importForm') {
                    let parsed;
                    try {
                        parsed = JSON.parse(data.data);
                    } catch (_) {
                        formError('JSON 格式无效，当前数据未改变');
                        return;
                    }
                    r = await call('import', {data: parsed});
                    if (r.ok) {
                        closeModal();
                        checkedCandidates.clear();
                        tabs = {};
                        filters = {};
                        selectedSession = {};
                        go('workspace');
                        render();
                        toast('已校验并导入演示数据');
                    }
                }
            } finally {
                busy = false;
                if (submit?.isConnected) submit.disabled = false;
            }
        });
        document.addEventListener('input', e => {
            const key = e.target.dataset.filter;
            if (!key) return;
            const selection = e.target.selectionStart;
            filters[key] = {...filters[key], search: e.target.value};
            render();
            const input = document.querySelector('[data-filter="' + CSS.escape(key) + '"]');
            if (input) {
                input.focus();
                input.setSelectionRange(selection, selection);
            }
        });
        document.addEventListener('change', async e => {
            if (e.target.dataset.statusFilter) {
                const key = e.target.dataset.statusFilter;
                filters[key] = {...filters[key], status: e.target.value};
                render();
            }
            if (e.target.dataset.candidate) {
                if (e.target.checked) checkedCandidates.add(e.target.dataset.candidate); else checkedCandidates.delete(e.target.dataset.candidate);
                render();
            }
            if (e.target.id === 'sessionSelect') {
                selectedSession[route.id] = e.target.value;
                render();
            }
            if (e.target.id === 'outcome') await call('mockOutcome', {outcome: e.target.value});
            if (e.target.id === 'importFile') {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 3000000) {
                        formError('文件超过 3 MB，演示导入不接受大文件');
                        return;
                    }
                    $('#f-data').value = await file.text();
                }
            }
            if (wizard && ['targetId', 'mode'].includes(e.target.name)) {
                captureWizard();
                const target = find(db.targets, wizard.data.targetId);
                if (!target.multiTurn && wizard.data.mode === 'ADAPTIVE_MULTI_TURN') wizard.data.mode = 'ADAPTIVE_SINGLE_TURN';
                const strategy = db.strategies.find(s => s.mode === wizard.data.mode && s.active);
                wizard.data.strategyId = strategy?.id || '';
                wizard.data.risks = wizard.data.risks.filter(id => !find(db.rules, id).needsTrace || target.trace);
                renderWizard();
            }
        });
        document.addEventListener('keydown', e => {
            const modal = $('#modalRoot .modal');
            if (e.key === 'Escape') {
                if (modal) closeModal();
                $('#sidebar').classList.remove('open');
                $('#mobileScrim').classList.remove('open');
                return;
            }
            if (e.key === 'Tab' && modal) {
                const items = [...modal.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]):not([type=hidden]),textarea,select:not([disabled]),[tabindex="0"]')].filter(el => el.getClientRects().length);
                if (!items.length) return;
                const first = items[0], last = items.at(-1);
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });
        window.addEventListener('hashchange', () => {
            closeModal();
            $('#sidebar').classList.remove('open');
            $('#mobileScrim').classList.remove('open');
            checkedCandidates.clear();
            const next = locationState();
            if (next.query.has('tab')) tabs[next.page] = next.query.get('tab');
            render();
            window.scrollTo({top: 0});
        });
        window.addEventListener('redteam:change', render);
        window.addEventListener('redteam:storage-warning', () => toast('浏览器存储不可用，当前操作仍可演示；可导出 JSON 保存。', true));
        render();
    }());
</script>
</body>
</html>
